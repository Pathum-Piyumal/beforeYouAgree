name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - "evaluation/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "evaluation/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: before_you_agree_test
          POSTGRES_USER: before_you_agree
          POSTGRES_PASSWORD: before_you_agree
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U before_you_agree -d before_you_agree_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://before_you_agree:before_you_agree@localhost:5432/before_you_agree_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall app
      - run: python -m ruff check app tests
      - run: alembic upgrade head
      - run: alembic downgrade 0001_initial_schema
      - run: alembic upgrade head
      - run: python -m pytest
      - run: python -m pytest tests/test_auth.py tests/test_history.py tests/test_users.py tests/test_reminders.py
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://before_you_agree:before_you_agree@localhost:5432/before_you_agree_test
      - run: python -m scripts.evaluate
